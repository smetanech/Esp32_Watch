; ESP32-S3 Pocket Weather - PlatformIO build
; Copy config.example.h to config.h first (sketch folder = src root)

[env:waveshare_esp32s3_epaper154]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
board_build.partitions = huge_app.csv
board_upload.flash_size = 4MB
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
monitor_speed = 115200
; upload_port = COM5          ; uncomment and set your port
lib_deps =
    zinggjm/GxEPD2
    adafruit/Adafruit GFX Library
    adafruit/Adafruit BusIO
    adafruit/Adafruit SHTC3 Library
    https://github.com/SolderedElectronics/Soldered-PCF85063A-Arduino-Library.git
