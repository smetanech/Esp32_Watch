[platformio]
src_dir = firmware
default_envs = esp32s3

[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
lib_deps =
  zinggjm/GxEPD2@^1.5.3
  adafruit/Adafruit SHTC3 Library
  https://github.com/SolderedElectronics/PCF85063A-SOLDERED-Arduino-Library.git
